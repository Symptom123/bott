<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Symptom Bot</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#030a10;--card:#091520;--border2:#0f3248;--accent:#00d4ff;--accent2:#00ff9f;--glow:rgba(0,212,255,0.15);--text:#e0f0ff;--muted:#5a8aaa;--red:#ff4444;--dim:#1a3a50}
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:1.5rem;
  }
  body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.05) 2px,rgba(0,0,0,0.05) 4px);pointer-events:none;z-index:9999}
  body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}

  .container{width:100%;max-width:440px;z-index:1}

  .logo-wrap{text-align:center;margin-bottom:1.8rem}
  .logo-wrap img{width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 0 24px var(--accent);object-fit:cover;margin-bottom:.8rem}
  .logo-title{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:900;color:var(--accent);letter-spacing:.15em;text-shadow:0 0 16px rgba(0,212,255,0.4)}
  .logo-title span{color:var(--accent2)}
  .logo-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);letter-spacing:.12em;margin-top:.3rem}

  .card{
    background:rgba(9,21,32,0.95);
    border:1px solid rgba(0,212,255,0.14);
    border-radius:16px;padding:2rem;
    box-shadow:0 0 40px rgba(0,212,255,0.08);
    backdrop-filter:blur(10px);
  }
  .card-top{
    display:flex;align-items:center;gap:.5rem;
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;color:var(--accent2);letter-spacing:.1em;
    margin-bottom:1.5rem;padding-bottom:1rem;
    border-bottom:1px solid rgba(0,212,255,0.08);
  }
  .card-top::before{content:'●';color:var(--accent2);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .card-title{
    font-family:'JetBrains Mono',monospace;
    font-size:.88rem;color:var(--accent);
    letter-spacing:.08em;margin-bottom:1.5rem;text-transform:uppercase;
  }

  .fg{margin-bottom:1.1rem}
  label{
    display:block;font-family:'JetBrains Mono',monospace;
    font-size:.68rem;color:var(--muted);
    margin-bottom:.4rem;letter-spacing:.1em;text-transform:uppercase;
  }
  input{
    width:100%;padding:.75rem 1rem;
    background:rgba(3,13,22,0.8);
    border:1px solid rgba(0,212,255,0.15);
    border-radius:8px;color:var(--text);
    font-size:.88rem;font-family:'Inter',sans-serif;
    outline:none;transition:all .2s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,0.12);background:rgba(3,13,22,0.95)}
  input::placeholder{color:var(--dim);font-size:.82rem}
  .hint{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--dim);margin-top:.35rem;letter-spacing:.04em}

  .btn{
    width:100%;padding:.8rem;border-radius:8px;
    border:1px solid var(--accent);cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;
    margin-top:.6rem;transition:all .22s;
    background:transparent;color:var(--accent);
  }
  .btn:hover{background:var(--accent);color:#000;box-shadow:0 0 24px var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .alert{
    padding:.8rem 1rem;border-radius:8px;font-size:.8rem;
    margin-top:.9rem;display:none;letter-spacing:.03em;
    font-family:'Inter',sans-serif;line-height:1.5;
  }
  .alert-error{background:rgba(255,68,68,.06);border:1px solid rgba(255,68,68,.25);color:#ff9999}
  .alert-success{background:rgba(0,255,159,.06);border:1px solid rgba(0,255,159,.25);color:#00ff9f}

  .links{
    text-align:center;margin-top:1.3rem;
    font-size:.78rem;color:var(--muted);letter-spacing:.04em;
    font-family:'JetBrains Mono',monospace;
  }
  .links a{color:var(--accent);text-decoration:none;transition:text-shadow .2s}
  .links a:hover{text-shadow:0 0 10px var(--accent)}

  .back-link{
    display:block;text-align:center;margin-bottom:1rem;
    font-family:'JetBrains Mono',monospace;font-size:.7rem;
    color:var(--muted);text-decoration:none;letter-spacing:.08em;
    transition:color .2s;
  }
  .back-link:hover{color:var(--accent)}

  @media(max-width:480px){
    body{padding:1rem;align-items:flex-start;padding-top:2rem}
    .card{padding:1.5rem 1.2rem;border-radius:12px}
    .logo-wrap img{width:60px;height:60px}
    .logo-title{font-size:1.1rem}
  }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="/">← Back to home</a>

  <div class="logo-wrap">
    <img src="/logo.jpg" alt="Symptom Bot">
    <div class="logo-title">SYMPTOM<span>_BOT</span></div>
    <div class="logo-sub">[ REGISTER_NODE :: CREATE_ACCOUNT ]</div>
  </div>

  <div class="card">
    <div class="card-top">STATUS :: REGISTRATION_OPEN</div>
    <div class="card-title">› Initialize New Node</div>
    <form id="registerForm">
      <div class="fg">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. johndoe_99" required minlength="3" maxlength="20">
        <div class="hint">› 3–20 chars · letters, numbers, underscore only</div>
      </div>
      <div class="fg">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" required>
      </div>
      <div class="fg">
        <label>WhatsApp Number</label>
        <input type="tel" id="phoneNumber" placeholder="237620323830 (country code, no +)">
        <div class="hint">› Can be set later from your dashboard</div>
      </div>
      <div class="fg">
        <label>Access Key (Password)</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div class="fg">
        <label>Confirm Access Key</label>
        <input type="password" id="confirmPassword" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">[ Register Node ]</button>
      <div class="alert alert-error" id="errAlert"></div>
      <div class="alert alert-success" id="successAlert"></div>
    </form>
    <div class="links" style="margin-top:1.5rem">Already have a node? <a href="/dashboard">[ Access Portal ]</a></div>
  </div>
</div>

<script>
  const form = document.getElementById('registerForm')
  const errAlert = document.getElementById('errAlert')
  const successAlert = document.getElementById('successAlert')
  const submitBtn = document.getElementById('submitBtn')

  function showError(msg) { errAlert.textContent = '[!] ERROR :: ' + msg; errAlert.style.display='block'; successAlert.style.display='none' }
  function showSuccess(msg) { successAlert.textContent = '[✓] ' + msg; successAlert.style.display='block'; errAlert.style.display='none' }

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const username = document.getElementById('username').value.trim()
    const email = document.getElementById('email').value.trim()
    const phoneNumber = document.getElementById('phoneNumber').value.trim()
    const password = document.getElementById('password').value
    const confirmPassword = document.getElementById('confirmPassword').value

    if (password !== confirmPassword) return showError('ACCESS_KEY_MISMATCH — Passwords do not match')
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) return showError('INVALID_NODE_ID — Use 3-20 alphanumeric chars')

    submitBtn.disabled = true; submitBtn.textContent = '[ INITIALIZING... ]'
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, phoneNumber, password })
      })
      const data = await res.json()
      if (!res.ok) { showError(data.error || 'REGISTRATION_FAILED') }
      else {
        showSuccess('NODE_REGISTERED — Awaiting admin activation. Redirecting to portal...')
        form.reset()
        setTimeout(() => window.location.href = '/dashboard', 3500)
      }
    } catch { showError('NETWORK_ERROR — Connection refused. Try again.') }
    finally { submitBtn.disabled=false; submitBtn.textContent='[ Register Node ]' }
  })
</script>
</body>
</html>
